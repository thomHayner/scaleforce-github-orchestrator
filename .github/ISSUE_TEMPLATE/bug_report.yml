name: Bug report
description: Report a defect — something is broken or behaves incorrectly.
labels: ["bug", "intake"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time to report a bug. `scaleforce[bot]` will triage this and may ask follow-up questions.
  - type: textarea
    id: what-happened
    attributes:
      label: What happened?
      description: A clear description of the bug.
      placeholder: When I do X, Y happens instead of Z.
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. ...
        2. ...
        3. ...
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true
  - type: textarea
    id: environment
    attributes:
      label: Environment
      description: OS, Node version, relevant package versions, deployment context.
      placeholder: |
        - OS:
        - Node:
        - Probot:
    validations:
      required: false
  - type: textarea
    id: logs
    attributes:
      label: Logs / error output
      render: shell
    validations:
      required: false
